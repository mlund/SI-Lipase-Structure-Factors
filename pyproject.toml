[project]
name = "lipase-si"
version = "2.0.0"
description = "Supporting information for: Anisotropic protein-protein interactions in dilute and concentrated solutions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
requires-python = ">=3.12"
# Lower bounds only; exact versions live in uv.lock.
dependencies = [
    "cycler>=0.12",
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "numpy>=2",
    "pandas>=2.2",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "nbconvert>=7",
    "ruff>=0.12",
]

# No importable package; uv only manages the notebook environment.
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
# Default since ruff 0.6; explicit so notebooks are never silently skipped.
extend-include = ["*.ipynb"]
# Simulation notebooks are provenance for runs made with legacy Faunus; kept verbatim.
extend-exclude = [
    "twobody/noswap/run_2body_noswap.ipynb",
    "twobody/swap/run_simulation_eps*.ipynb",
    "manybody/noswap/run_manybody_noswap.ipynb",
    "manybody/swap/run_simulations.ipynb",
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "SIM",
    "PTH",      # pathlib over os.path: portable path handling
    "PLW1514",  # open() without encoding: default differs between OSes
]
# PLW1514 is a preview rule; enable just the explicitly selected ones.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Notebooks use markdown cells, and often import after explanatory cells.
# Analysis notebooks stay close to the published version: style-only rules
# whose fixes could change behaviour are not applied.
"*.ipynb" = [
    "E402", "E741", "F403", "F405", "F841",
    "B007", "B018", "B020", "B905", "SIM108", "SIM113",
]
